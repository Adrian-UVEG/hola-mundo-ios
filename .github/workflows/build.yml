name: Build and Screenshot iOS App

on: [push]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Compilar aplicación con Clang
        run: |
          SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          mkdir -p HolaMundo.app

          # Se agrega -framework CoreGraphics para resolver CGRectZero
          clang -arch arm64 -isysroot "$SDK_PATH" \
            -mios-simulator-version-min=15.0 \
            -fobjc-arc \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            main.m AppDelegate.m ViewController.m \
            -o HolaMundo.app/HolaMundo

          cp Info.plist HolaMundo.app/

      - name: Ejecutar en el simulador y tomar screenshot
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "Usando simulador: $DEVICE_UDID"

          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl install "$DEVICE_UDID" HolaMundo.app
          xcrun simctl launch "$DEVICE_UDID" com.ejemplo.holamundo

          sleep 4

          xcrun simctl io "$DEVICE_UDID" screenshot screenshot.png

      - name: Subir captura como evidencia
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-ios
          path: screenshot.png
